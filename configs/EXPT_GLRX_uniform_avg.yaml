base_config_path: "configs/SyntalNet.yaml"
base_checkpoint_dir: "checkpoints/SyntalNet"
base_checkpoint_name: "epoch_100.pth"

cv_mode: "kfold"
n_folds: 5
output_root: "experiments/multimodal_fusion_results"
device: "cuda:0"

fusion:
  name: "uniform_avg"
  kwargs:
    use_ln: true

reliability:
  p_corrupt: 0.7
  dropout_range: [0.2, 0.5]
  noise_range: [0.2, 0.5]
  shuffle_range: [0.2, 0.5]
  mix: {dropout: 0.4, noise: 0.4, shuffle: 0.2}

training:
  num_epochs: 20
  learning_rate: null
  weight_decay: null
  grad_clip: 1.0
  accum_steps: 1
  scheduler: "reduce_on_plateau"
  scheduler_factor: 0.5
  scheduler_patience: 3
  scheduler_threshold: 0.01
  scheduler_min_lr: 1.0e-7

stress:
  corruption_grid:
    dropout: [0.0, 0.15, 0.30, 0.45, 0.60, 0.75]
    noise: [0.0, 0.15, 0.30, 0.45, 0.60, 0.75]
    shuffle: [0.0, 0.15, 0.30, 0.45, 0.60, 0.75]
  per_modality: false
  run_allocation: false

