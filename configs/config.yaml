model:
  name: SyntalNet
  args: {}

dataset:
  args:
    root_dir: "./data"
    modalities: ["face", "pose", "video", "turns", "utterance", "sentiment", "prosody", "audio",]
  split:
    mode: "item"  # "item" or "group" based split
    ratio: 0.2    # train-val split ratio
    groups: []    # groups to hold out for val
    seed: 17
  class_counts:
    individual:
      Engagement: [2006, 6078, 1996]
      Lead:       [2268, 5494, 2318]
    group:
      Synchrony:  [931, 1505, 924]
      Confidence: [1025, 1354, 981]
      Transition: [961, 1401, 998]

training:
  seed: 42
  num_workers: 4
  epochs: 100
  batch_size: 16
  val_batch_size: 16
  learning_rate: 3e-4
  weight_decay: 1e-4
  warmup_steps: 1000
  min_lr: 1e-6
  grad_clip: 1.0
  accum_steps: 1
  amp: False
  cb_beta: 0.999
  focal_gamma: 2.0
  label_smoothing: 0.05
  val_interval: 1

logging:
  log_dir: ./logs
  checkpoint_dir: ./checkpoints
